<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: html(head = null, content = ~{::content}, title = null)}">
<body>
<th:block th:fragment="content">
  <section class="hero">
    <span class="hero-seal" aria-hidden="true">烟雨</span>
    <h1 class="hero-title" th:text="${theme.config?.basic?.hero_title ?: site.title}">江南烟雨</h1>
    <p class="hero-subtitle" th:text="${theme.config?.basic?.hero_subtitle ?: site.subtitle}">青砖黛瓦，烟雨江南</p>
  </section>

  <ul class="post-list" th:if="${not #lists.isEmpty(posts.items)}">
    <li class="post-card" th:each="post : ${posts.items}">
      <a th:if="${post.spec.cover != null and !#strings.isEmpty(post.spec.cover)}" th:href="@{${post.status.permalink}}">
        <img class="post-cover" th:src="${post.spec.cover}" th:alt="${post.spec.title}" loading="lazy" />
      </a>
      <div class="post-content">
        <h2 class="post-title">
          <span class="post-pinned" th:if="${post.spec.pinned}">置顶</span>
          <a th:href="@{${post.status.permalink}}" th:text="${post.spec.title}">文章标题</a>
        </h2>
        <p class="post-excerpt" th:text="${post.status.excerpt}">文章摘要</p>
        <div class="post-meta">
          <span class="post-meta-item" th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}">2026-11-06</span>
          <a class="post-meta-item" th:if="${not #lists.isEmpty(post.categories)}" th:href="@{${post.categories[0].status.permalink}}" th:text="${post.categories[0].spec.displayName}">分类</a>
          <span class="post-meta-item" th:text="${post.stats?.visit ?: 0} + ' 阅读'">0 阅读</span>
        </div>
      </div>
    </li>
  </ul>

  <p class="empty-tip" th:if="${#lists.isEmpty(posts.items)}">暂无文章，待墨再续。</p>

  <nav class="pagination" th:if="${posts.hasPrevious() || posts.hasNext()}">
    <a class="btn btn-secondary" th:if="${posts.hasPrevious()}" th:href="@{${posts.prevUrl}}">上一页</a>
    <a class="btn btn-primary" th:if="${posts.hasNext()}" th:href="@{${posts.nextUrl}}">下一页</a>
  </nav>
</th:block>
</body>
</html>
